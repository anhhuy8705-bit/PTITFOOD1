<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTITFOOD | Thực đơn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        soft: '0 10px 30px rgba(15, 23, 42, 0.08)'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-xl">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
            <a href="index.html" class="flex items-center gap-3">
                <img src="ptit.png" alt="PTITFOOD" class="brand-logo" />
            </a>

            <nav class="flex items-center gap-2 sm:gap-5 md:gap-6 lg:gap-7">
                <a href="index.html" class="nav-link" data-nav="home">Trang chủ</a>
                <a href="products.html" class="nav-link active" data-nav="products">Thực đơn</a>
            </nav>

            <div class="flex items-center gap-3">
                <form id="headerSearchForm"
                    class="hidden items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-2 md:flex">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M8.5 3a5.5 5.5 0 104.32 9.4l2.57 2.57 1.41-1.41-2.57-2.57A5.5 5.5 0 008.5 3zm0 2a3.5 3.5 0 110 7 3.5 3.5 0 010-7z"
                            clip-rule="evenodd" />
                    </svg>
                    <input type="text" placeholder="Tìm món..."
                        class="w-32 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                        aria-label="Tìm món ăn" />
                </form>

                <a href="cart.html"
                    class="relative inline-flex shrink-0 items-center justify-center gap-1 rounded-full bg-slate-900 px-2.5 py-2 text-sm font-medium text-white transition hover:bg-slate-800 sm:gap-2 sm:px-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 3h2l.4 2.1M7 15h8l2-8H5.3M7 15a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm8 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM6.4 5.1L5.9 3H3"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            fill="none" />
                    </svg>
                    <span class="hidden sm:inline">Giỏ hàng</span>
                    <span data-cart-count
                        class="hidden min-h-5 min-w-5 rounded-full bg-orange-500 px-1 text-center text-xs font-semibold text-white">0</span>
                </a>

                <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5">
                    <div
                        class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-slate-200 to-slate-300 text-sm font-bold text-slate-700">
                        FU</div>
                    <span class="hidden text-sm font-medium text-slate-700 sm:inline">Người dùng</span>
                </div>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <section class="rounded-[32px] bg-gradient-to-r from-orange-500 to-red-500 p-8 text-white shadow-soft">
            <p class="text-sm font-medium uppercase tracking-[0.2em] text-orange-100">Menu</p>
            <h1 class="mt-3 text-3xl font-extrabold sm:text-4xl">Tất cả món ăn</h1>
        </section>

        <section class="mt-8 rounded-3xl bg-white p-4 shadow-soft sm:p-6">
            <div class="grid gap-4 md:grid-cols-3">
                <label class="space-y-2">
                    <span class="text-sm font-medium text-slate-700">Tìm kiếm</span>
                    <input id="productSearch" type="text" placeholder="Tên món, nhà hàng, danh mục..."
                        class="w-full rounded-2xl border border-[#e7d7c3] bg-[#f7efe6] px-4 py-3 text-[#6d3a1b] outline-none transition focus:border-[#d7b690] focus:ring-2 focus:ring-[#f0e0cd]"
                        aria-label="Search products" />
                </label>

                <label class="space-y-2">
                    <span class="text-sm font-medium text-slate-700">Danh mục</span>
                    <select id="categoryFilter"
                        class="w-full rounded-2xl border border-[#e7d7c3] bg-[#f7efe6] px-4 py-3 text-[#6d3a1b] outline-none transition focus:border-[#d7b690] focus:ring-2 focus:ring-[#f0e0cd]"
                        aria-label="Category filter">
                        <option value="Tất cả">Tất cả</option>
                    </select>
                </label>

                <label class="space-y-2">
                    <span class="text-sm font-medium text-slate-700">Sắp xếp</span>
                    <select id="sortSelect"
                        class="w-full rounded-2xl border border-[#e7d7c3] bg-[#f7efe6] px-4 py-3 text-[#6d3a1b] outline-none transition focus:border-[#d7b690] focus:ring-2 focus:ring-[#f0e0cd]"
                        aria-label="Sort products">
                        <option value="popular">Phổ biến nhất</option>
                        <option value="price-asc">Giá thấp → cao</option>
                        <option value="price-desc">Giá cao → thấp</option>
                        <option value="rating">Đánh giá cao</option>
                    </select>
                </label>
            </div>
        </section>

        <section class="mt-8">
            <div id="productsGrid" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
        </section>
    </main>

    <script type="module" src="js/products.js"></script>
</body>

</html>
