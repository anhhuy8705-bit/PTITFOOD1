<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTITFOOD | Chi tiết món</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        soft: '0 10px 30px rgba(15, 23, 42, 0.08)'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-xl">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
            <a href="index.html" class="flex items-center gap-3">
                <div
                    class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-orange-500 to-red-500 text-lg font-bold text-white shadow-soft">
                    F</div>
                <div class="text-xl font-extrabold tracking-tight text-slate-900">PTITFOOD</div>
            </a>

            <nav class="hidden items-center gap-6 md:flex">
                <a href="index.html" class="nav-link" data-nav="home">Trang chủ</a>
                <a href="products.html" class="nav-link active" data-nav="products">Thực đơn</a>
                <a href="cart.html" class="nav-link" data-nav="cart">Giỏ hàng</a>
            </nav>

            <div class="flex items-center gap-3">
                <form id="headerSearchForm"
                    class="hidden items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-2 md:flex">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M8.5 3a5.5 5.5 0 104.32 9.4l2.57 2.57 1.41-1.41-2.57-2.57A5.5 5.5 0 008.5 3zm0 2a3.5 3.5 0 110 7 3.5 3.5 0 010-7z"
                            clip-rule="evenodd" />
                    </svg>
                    <input type="text" placeholder="Tìm món..."
                        class="w-32 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                        aria-label="Tìm món ăn" />
                </form>

                <a href="cart.html"
                    class="relative inline-flex items-center gap-2 rounded-full bg-slate-900 px-3 py-2 text-sm font-medium text-white transition hover:bg-slate-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 3h2l.4 2.1M7 15h8l2-8H5.3M7 15a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm8 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM6.4 5.1L5.9 3H3"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            fill="none" />
                    </svg>
                    <span>Giỏ hàng</span>
                    <span data-cart-count
                        class="hidden min-h-5 min-w-5 rounded-full bg-orange-500 px-1 text-center text-xs font-semibold text-white">0</span>
                </a>

                <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5">
                    <div
                        class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-slate-200 to-slate-300 text-sm font-bold text-slate-700">
                        FU</div>
                    <span class="hidden text-sm font-medium text-slate-700 sm:inline">Người dùng</span>
                </div>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div id="productDetailContainer" class="space-y-8"></div>

        <section class="mt-12 rounded-3xl bg-white p-6 shadow-soft">
            <div class="mb-6 flex items-center justify-between gap-4">
                <h2 class="text-3xl font-bold text-slate-900">Đánh giá của khách hàng</h2>
                <a href="products.html" class="text-sm font-semibold text-orange-600">Quay lại thực đơn</a>
            </div>
            <div id="reviewList" class="space-y-4"></div>
        </section>

        <section class="mt-10 rounded-3xl bg-white p-6 shadow-soft">
            <h3 class="text-2xl font-bold text-slate-900">Đánh giá món ăn</h3>
            <form id="reviewForm" class="mt-6 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Đánh giá của bạn</label>
                    <div class="mt-3 flex items-center gap-2 text-2xl">
                        <button type="button" class="star-button" data-rating-star="1" aria-label="1 sao">★</button>
                        <button type="button" class="star-button" data-rating-star="2" aria-label="2 sao">★</button>
                        <button type="button" class="star-button" data-rating-star="3" aria-label="3 sao">★</button>
                        <button type="button" class="star-button" data-rating-star="4" aria-label="4 sao">★</button>
                        <button type="button" class="star-button" data-rating-star="5" aria-label="5 sao">★</button>
                        <input type="hidden" id="reviewRating" name="rating" />
                    </div>
                </div>
                <div>
                    <label for="reviewComment" class="block text-sm font-medium text-slate-700">Nội dung đánh
                        giá</label>
                    <textarea id="reviewComment" name="comment" rows="4"
                        class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-700 outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100"
                        placeholder="Mô tả trải nghiệm của bạn..."></textarea>
                </div>
                <button type="submit" class="primary-button">Gửi đánh giá</button>
            </form>
        </section>
    </main>

    <script type="module" src="js/product-detail.js"></script>
</body>

</html>
